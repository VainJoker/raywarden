name: Release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a token that triggers PR and tag workflows
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo '::error::Set repository secret RELEASE_PLZ_TOKEN with Contents and Pull requests read/write access. See docs/deployment.md.'
            exit 1
          fi
      - name: Check out complete release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Rust for Cargo metadata
        run: rustup toolchain install --no-self-update
      - name: Install release-plz once
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz@0.4.3
      - name: Configure release author from token
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Keep release before release-pr so the next PR uses the new tag baseline.
      - name: Release merged PR and prepare the next release PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          release-plz release --git-token "$GITHUB_TOKEN"
          release-plz release-pr --git-token "$GITHUB_TOKEN" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
