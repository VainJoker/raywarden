name: Deploy to Cloudflare

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"

jobs:
  deploy:
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # New checks may cancel older checks, but must never interrupt a D1 migration.
    concurrency:
      group: cloudflare-deploy-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out the checked release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the validated release artifact
        uses: actions/download-artifact@v7
        with:
          name: raywarden-release-production-${{ github.sha }}
          path: .
      - name: Set up project tools
        uses: ./.github/actions/setup
      - name: Verify artifact commit, configuration, modules, assets and locks
        env:
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
        run: just artifact-check
      - name: Install only the locked deployment CLI
        run: just setup-deploy
      - name: Validate supplied Secrets before migrating D1
        env:
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
        run: just deploy-preflight
      - name: Verify resources and migrate D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          just resources
          just db-migrate production
      - name: Upload the compiled Worker and application Secrets
        env:
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          OWNER_SETUP_TOKEN: ${{ secrets.OWNER_SETUP_TOKEN }}
          KEY_ENCRYPTION_KEY: ${{ secrets.KEY_ENCRYPTION_KEY }}
        run: just deploy-worker
      - name: Verify the configured public health endpoint
        env:
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just deploy-health
