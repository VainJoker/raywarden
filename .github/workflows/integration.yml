name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux Rust, JavaScript, SQL and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Install pinned project tools and dependencies
        run: just setup
      - name: Check Rust, Node and SQL
        run: just ci
      - name: Prepare Web Vault and validate the release Worker bundle
        run: just dry-run
      - name: Exercise compiled Rust Worker in workerd without a listener
        run: just test-worker
      - name: Exercise fresh D1 migrations and file lifecycle with native Worker bindings
        run: just test-d1
      - name: Record artifact source, configuration and file digests
        if: startsWith(github.ref, 'refs/tags/v')
        run: just artifact
      - name: Upload validated release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: raywarden-release-production-${{ github.sha }}
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            static/web-vault/
            Cargo.lock
            package-lock.json
            .wrangler/artifact-manifest.json
            .wrangler/deploy-check/production/

  coverage:
    name: Host Rust library coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Install host coverage tools
        run: just coverage-setup
      - name: Collect host Rust library coverage
        run: just coverage
      - name: Upload LCOV report
        uses: actions/upload-artifact@v7
        with:
          name: rust-library-coverage
          overwrite: true
          path: coverage/lcov.info
          if-no-files-found: error
