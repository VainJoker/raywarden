name: Integration

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux Rust, JavaScript, SQL and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up project tools
        uses: ./.github/actions/setup
        with:
          rust: "true"
      - name: Install pinned project tools and dependencies
        run: just setup
      - name: Check Rust, Node and SQL
        run: just ci
      - name: Prepare pinned Web Vault
        run: just ui-download
      - name: Validate release Worker bundle without deploying
        run: just dry-run
      - name: Exercise compiled Rust Worker in workerd without a listener
        run: just test-worker
      - name: Record artifact source, configuration and file digests
        run: just artifact
      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: raywarden-release-production-${{ github.sha }}
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            static/web-vault/
            Cargo.lock
            package-lock.json
            .wrangler/artifact-manifest.json
            .wrangler/deploy-check/production/

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloudflare.yaml
    secrets: inherit
