<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raywarden 所有者初始化</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#182433;max-width:34rem;margin:12vh auto;padding:1.5rem}
    main{background:white;padding:2rem;border-radius:1rem;box-shadow:0 4px 24px #18243315}
    p{line-height:1.6}label,input,button{display:block;width:100%;box-sizing:border-box}input,button{padding:.8rem;margin:.7rem 0;border:1px solid #b7c3d3;border-radius:.4rem}button{background:#175ddc;color:white;cursor:pointer}button:disabled{opacity:.6}#status{min-height:2rem}
  </style>
</head>
<body>
<main>
  <h1>初始化唯一所有者</h1>
  <p>输入部署时设置的初始化令牌，授权此浏览器在十分钟内创建账户。下一步由正式 Web Vault 生成和提交账户加密材料；本站不会为你生成主密码或客户端密钥。</p>
  <form id="setup-form">
    <label for="setup-token">初始化令牌</label>
    <input id="setup-token" type="password" autocomplete="off" required minlength="32" maxlength="512" spellcheck="false">
    <button id="authorize" type="submit">授权并进入账户创建</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <p>请使用部署时指定的唯一邮箱。令牌只用于初始化，不是主密码；账户创建成功后，初始化入口将关闭。</p>
</main>
<script>
  (() => {
    const form = document.getElementById("setup-form");
    const input = document.getElementById("setup-token");
    const button = document.getElementById("authorize");
    const status = document.getElementById("status");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (button.disabled) return;
      const token = input.value;
      input.value = "";
      button.disabled = true;
      status.textContent = "正在验证初始化授权…";
      try {
        const response = await fetch("/api/accounts/setup", {
          method: "POST", credentials: "same-origin", cache: "no-store", redirect: "error",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token })
        });
        if (!response.ok) {
          status.textContent = response.status === 409
            ? "账户已初始化，请返回正式 Web Vault 登录。"
            : "无法完成授权。请核对部署令牌、邮箱配置及当前初始化状态。";
          return;
        }
        location.replace("/#/signup");
      } catch {
        status.textContent = "请求未完成，请检查本站连接后重试。";
      } finally {
        button.disabled = false;
      }
    });
  })();
</script>
</body>
</html>
